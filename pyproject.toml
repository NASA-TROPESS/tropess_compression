[build-system]
requires = ["setuptools>=62.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tropess-compression"
authors = [
  { name = "Matthew Thill", email = "Matthew.D.Thill@jpl.nasa.gov"}
]

maintainers = [
  { name = "James McDuffie", email = "James.McDuffie@jpl.nasa.gov" }
]

description='TROPESS Averaging Kernel and Covariance Compression Tool'
requires-python = ">=3.8"
version = "1.3.0"

dependencies = [
  "numpy",
  "netcdf4",
  "nco",
  "threadpoolctl",
  "bitarray",
]

[project.scripts]
compress_tropess_file = "tropess_compression.compress_tropess_file:main"
decompress_tropess_file = "tropess_compression.decompress_tropess_file:main"

[tool.setuptools.packages.find]
include = ["tropess_compression*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.12"
numpy = ">=2.1.2"
netcdf4 = ">=1.7.1"
nco = ">=5.2.8"
threadpoolctl = ">=3.6.0"
pip = "*"

[tool.pixi.pypi-dependencies]
tropess-compression = { path = ".", editable = true }

[tool.pixi.tasks]
compress_tropess_file = "compress_tropess_file"
decompress_tropess_file = "decompress_tropess_file"
